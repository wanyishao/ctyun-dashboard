name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 质量闸门：语法检查 + 结构性回归测试。任一失败即终止，绝不构建/推送坏镜像。
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 移动公众协议侧车的运行时依赖：确保回归测试可真实拉起侧车完成完整验证
      - name: Set up Python (sidecar runtime)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sidecar dependencies
        run: pip install -r app/ecloud_engine/requirements.txt

      - name: Syntax check (node --check)
        run: node tests/syntax_check.js

      - name: Regression invariants
        run: node tests/regression.test.js

      # 配置多架构模拟（ARM64 + AMD64）与 Buildx 构建器
      - name: Set up QEMU (for linux/amd64 & linux/arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. 登录 GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. 可选登录 Docker Hub（仅在配置 DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN 时启用）
      - name: Log in to Docker Hub
        id: dockerhub-login
        continue-on-error: true
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}
        if: env.DOCKER_USER != '' && env.DOCKER_PASS != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ env.DOCKER_PASS }}

      # 3. 组装目标镜像列表（GHCR 自动转小写，避免大写用户名报错）
      - name: Determine Docker images
        id: image-targets
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          REPO_LOWER="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          IMAGES="ghcr.io/${REPO_LOWER}"
          if [ "${{ steps.dockerhub-login.outcome }}" = "success" ] && [ -n "${DOCKER_USER}" ]; then
            USER_LOWER="$(echo "${DOCKER_USER}" | tr '[:upper:]' '[:lower:]')"
            NAME_LOWER="$(echo "${REPO_NAME}" | tr '[:upper:]' '[:lower:]')"
            IMAGES="${IMAGES}
          ${USER_LOWER}/${NAME_LOWER}"
          fi
          echo "images<<EOF" >> "$GITHUB_OUTPUT"
          echo "$IMAGES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # 4. 提取镜像元数据与多架构标签（main 分支和 v* 标签同步更新 latest）
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-targets.outputs.images }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # 5. 构建并推送多架构镜像 (linux/amd64, linux/arm64)
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
            PIP_INDEX_URL=https://pypi.org/simple
          cache-from: type=gha
          cache-to: type=gha,mode=max
