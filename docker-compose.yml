services:
  ctyun-dashboard:
    image: ghcr.io/wanyishao/ctyun-dashboard:latest
    container_name: ctyun-dashboard
    restart: unless-stopped
    network_mode: "bridge"
    ports:
      - "127.0.0.1:8571:8571"
    environment:
      - TZ=Asia/Shanghai
      - PORT=8571
      - CTYUN_DATA_DIR=/app/data
      - CTYUN_INSTANCE_NAME=ctyun-dashboard
    volumes:
      - ./data:/app/data
      # 移动公众可选覆盖凭据（默认已内置公开常量，无需配置）：
      # - ./data/ecloud_credentials.json:/app/data/ecloud_credentials.json:ro
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
